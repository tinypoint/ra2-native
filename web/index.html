<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>红色警戒 2</title>
<link rel="stylesheet" href="style.css?ui=clean-controls-1">
</head>
<body data-view="game" class="game-shell">
<main><section><div id="game-window">
<canvas id="canvas" width="640" height="480" tabindex="0" aria-label="游戏画面"></canvas>
<div id="boot-progress" hidden role="status"><span id="boot-phase"></span><progress id="boot-bar" max="1"></progress><small id="boot-detail"></small></div>
</div>
<div id="game-controls" role="toolbar" aria-label="游戏控制">
<div id="mobile-controls" aria-label="游戏快捷键">
<div id="view-stick" role="group" aria-label="视野摇杆"><span id="view-stick-thumb" aria-hidden="true"></span></div>
<button type="button" id="mobile-cancel" aria-label="取消选择（鼠标右键）" title="取消选择"><span class="pad-label">取消</span></button>
<button type="button" id="mobile-home" aria-label="回基地（H 键）" title="回基地"><span class="pad-label">基地</span></button>
</div>

</div></section></main>
<div id="game-error" role="alert" hidden><p id="error-message"></p><button type="button" id="start" disabled>重试</button><button type="button" id="copy-diagnostics" class="secondary">复制诊断</button><button type="button" id="export-diagnostics" class="secondary">导出诊断</button></div>
<script src="runtime-update.js?ui=release-parts-1"></script>
<script src="frame-meter.js?ui=joystick-1"></script>
<script src="app.js?ui=memory-diagnostics-1"></script>
</body>
</html>
